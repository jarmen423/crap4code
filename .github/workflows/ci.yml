name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Run test suite
        run: python -m pytest -q

      - name: Run case-mismatch tests (phase1 R1) explicitly in matrix
        run: python -m pytest -q -k "case_insensitive_fallback"

      - name: Run phase1/2 cross-platform tests (unavailable, no-files, changed) in matrix
        run: python -m pytest -q -k "unavailable_lang or no_files_found or changed_flag_in_non_git_dir_emits_warning"

      - name: Verify E2 git warning for --changed on windows-latest with non-git temp dir
        if: matrix.os == 'windows-latest'
        run: python -m pytest -q -k "test_changed_flag_in_non_git_dir_emits_warning" --tb=line

  minimal-install-verify:
    # Lightweight job to exercise lazy loading + case behaviors under simulated
    # minimal/python-only install (uninstall other grammars post full install).
    # Runs the exact verification commands from the phase3-ci / Dev4 plan section.
    # Only needs one py version; exercises real missing grammars for python-only.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project (full)
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Simulate minimal/python-only install (uninstall non-python grammars)
        # tree-sitter core stays; python analyzer uses stdlib ast only (no grammar pkg)
        run: python -m pip uninstall -y tree-sitter-javascript tree-sitter-typescript tree-sitter-rust || echo "uninstall step completed"

      - name: Verify only python language available via registry (lazy load)
        run: python -c "from crap4code.languages import get_language_registry; print(sorted(get_language_registry().keys()))"

      - name: Make verify script executable (for direct invocation or clarity)
        # The original inline heredoc was replaced by this extracted script (see next step).
        # We still chmod for good hygiene / future direct ./ usage even though we invoke
        # via the python interpreter below.
        run: chmod +x scripts/verify_minimal_install.py

      - name: Verify python scan works + --lang rust fails gracefully (real minimal)
        # The verification logic was extracted to scripts/verify_minimal_install.py
        # to eliminate the fragile inline heredoc (python - << 'PYEOF' ...) that
        # produced YAML syntax errors ("while scanning a simple key" / "could not find
        # expected ':'") because the heredoc payload lines were not indented inside
        # the YAML literal block scalar (run: |).
        #
        # The script performs exactly the same checks (registry assert under minimal,
        # graceful --lang rust failure with correct messages + exit 1, tempdir project
        # with .py + .crap4code.toml, chdir + `main scan --lang python --report-only`,
        # assert "foo" in output, and the original success marker prints).
        #
        # Comments explaining the purpose are preserved here and in the job header
        # (minimal verify for lazy D1 + phase3-ci/Dev4). The script itself has a
        # full module docstring + inline comments for the same reasons.
        #
        # This keeps the spirit of the original verification (and the manual steps
        # documented in docs/release-checklist.md) while making the workflow YAML
        # robust and easy to maintain.
        #
        # Invocation uses `python scripts/...` (portable, no shebang dependency).
        # The prior steps in this job ensure the full install + grammar uninstalls
        # have already happened, so the script runs against the true minimal state.
        run: python scripts/verify_minimal_install.py

      - name: Run targeted tests safe under minimal (case + no_files + unavailable)
        run: python -m pytest -q -k "case_insensitive_fallback or no_files_found_returns_0 or unavailable_lang_returns_nonzero" --tb=no

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*
